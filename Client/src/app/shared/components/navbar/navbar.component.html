<nav class="navbar" *ngIf="authService.isLoggedIn">
  <div class="navbar-brand">
    <span class="logo">🐾 Somo</span>
  </div>

  <div class="navbar-links">
    
    <ng-container *ngIf="authService.hasRole('Owner')">
      <a routerLink="/clinics" routerLinkActive="active">Cabinete</a>
      <a routerLink="/my-pets" routerLinkActive="active">Animalele mele</a>
      <a routerLink="/appointments/new" routerLinkActive="active">Programare nouă</a>
      <a routerLink="/my-appointments" routerLinkActive="active">Programările mele</a>
    </ng-container>

    
    <ng-container *ngIf="authService.hasRole('ClinicAdmin')">
      <a routerLink="/clinic-dashboard" routerLinkActive="active">Dashboard cabinet</a>
      <a routerLink="/register-clinic" routerLinkActive="active">Înregistrează cabinet</a>
    </ng-container>
  </div>

  <div class="navbar-user">
    <span class="username">{{ authService.currentUser?.username }}</span>
    <button (click)="logout()">Ieși din cont</button>
  </div>
</nav>
