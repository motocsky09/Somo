<div class="pets-container">
  <div class="pets-header">
    <h2>Animalele mele</h2>
    <button class="add-btn" (click)="showAddForm = !showAddForm">
      {{ showAddForm ? '✕ Anulează' : '+ Adaugă animal' }}
    </button>
  </div>

  
  <div class="add-form-container" *ngIf="showAddForm">
    <h3>Animal nou</h3>
    <form [formGroup]="addPetForm" (ngSubmit)="onAddPet()">
      <div class="form-row">
        <div class="form-group">
          <label>Nume</label>
          <input type="text" formControlName="name" placeholder="ex: Mango" />
        </div>
        <div class="form-group">
          <label>Specie</label>
          <select formControlName="species">
            <option *ngFor="let s of speciesList" [value]="s">{{ s }}</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Rasă</label>
          <input type="text" formControlName="breed" placeholder="ex: European" />
        </div>
        <div class="form-group">
          <label>Vârstă (ani)</label>
          <input type="number" formControlName="age" min="0" max="50" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Greutate (kg)</label>
          <input type="number" formControlName="weight" min="0" step="0.1" />
        </div>
      </div>

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button type="submit" class="submit-btn" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Se adaugă...' : 'Adaugă animal' }}
      </button>
    </form>
  </div>

  
  <div class="loading" *ngIf="isLoading">
    <p>Se încarcă...</p>
  </div>

  
  <div class="pets-grid" *ngIf="!isLoading">
    <div class="empty-state" *ngIf="pets.length === 0">
      <p>🐾</p>
      <p>Nu ai adăugat niciun animal încă.</p>
      <button (click)="showAddForm = true">Adaugă primul tău animal</button>
    </div>

    <div class="pet-card" *ngFor="let pet of pets">
      <div class="pet-emoji">{{ getSpeciesEmoji(pet.species) }}</div>
      <div class="pet-info">
        <h3>{{ pet.name }}</h3>
        <p>{{ pet.species }} • {{ pet.breed }}</p>
        <p>{{ pet.age }} ani • {{ pet.weight }} kg</p>
      </div>
      <div class="pet-actions">
        <button class="appointment-btn" routerLink="/appointments/new">
          Programare
        </button>
        <button class="delete-btn" (click)="onDeletePet(pet.id)">🗑️</button>
      </div>
    </div>
  </div>
</div>
