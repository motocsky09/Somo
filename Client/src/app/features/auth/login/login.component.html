<div class="login-container">
  <div class="login-card">
    <h2>Bine ai venit la Somo</h2>
    <p class="subtitle">Găsește cabinete veterinare și fă programări</p>

    <div class="info-banner" *ngIf="infoMessage">
      <span class="info-icon">🔒</span>
      <span>{{ infoMessage }}</span>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Username</label>
        <input
          type="text"
          formControlName="username"
          placeholder="Introdu username-ul"
          [class.invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched"
        />
      </div>

      <div class="form-group">
        <label>Parolă</label>
        <input
          type="password"
          formControlName="password"
          placeholder="Introdu parola"
          [class.invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        />
      </div>

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Se încarcă...' : 'Intră în cont' }}
      </button>
    </form>

    <p class="register-link">
      Nu ai cont? <a routerLink="/register" [queryParams]="{ authRequired: infoMessage ? '1' : null }">Înregistrează-te</a>
    </p>
  </div>
</div>
